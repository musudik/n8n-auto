version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - n8n
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c"
    command: >
      "certbot certonly --webroot 
       --webroot-path=/var/www/certbot 
       --email kiran.musudi@gmail.com 
       --agree-tos 
       --no-eff-email 
       -d thinkeuros.de 
       -d www.thinkeuros.de"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=https://thinkeuros.de
      - N8N_HOST=thinkeuros.de
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_SECURE_COOKIE=true
    volumes:
      - ./n8n-data:/home/node/.n8n
    restart: unless-stopped

  miniio:
    image: quay.io/minio/minio
    container_name: miniio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data
    restart: unless-stopped

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    restart: unless-stopped

  baserow:
    image: baserow/baserow:1.32.5
    container_name: baserow
    ports:
      - "85:80"
    environment:
      - BASEROW_PUBLIC_URL=http://host.docker.internal:85
    volumes:
      - ./baserow-data:/baserow/data
    restart: unless-stopped
