# HTTP - for Let's Encrypt validation
server {
    listen 80;
    server_name thinkeuros.de www.thinkeuros.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - reverse proxy to n8n
server {
    listen 443 ssl;
    server_name thinkeuros.de www.thinkeuros.de;

    ssl_certificate /etc/letsencrypt/live/thinkeuros.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thinkeuros.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }
}
